<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praxora — Praxis-Cockpit</title>
<meta name="description" content="Das Cockpit für Praxen mit Duria². Getrennt in das, was die Praxis bedient, und das, was der Patient sieht.">
<style>
:root{
  --tinte:#0f172a;
  --g700:#334155; --g600:#475569; --g500:#64748b;
  --g400:#94a3b8; --g300:#cbd5e1; --g200:#e2e8f0; --g100:#f1f5f9; --g50:#f8fafc;
  --akzent:#0b6e99; --akzent-tief:#074b69; --akzent-hell:#e9f3f8;
  --gruen:#0f7a55; --gruen-hell:#e7f5ef;
  --gelb:#a1620a; --gelb-hell:#fdf4e3;
  --rot:#b02a2a;  --rot-hell:#fbecec;
  --rand:#e4e9ef;
  --schatten:0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.04);
  --leiste:244px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.55; color:var(--g700); background:var(--g50);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--akzent);text-decoration:none}

/* ============================ Gerüst ============================ */
.huelle{display:flex;min-height:100vh}

.seitenleiste{
  width:var(--leiste); flex:0 0 var(--leiste);
  background:var(--tinte); color:#cdd8e4;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.marke{padding:20px 20px 14px}
.marke .wort{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.01em}
.marke .wort span{color:#5eb3d6}

/* Umschalter Praxis / Patient */
.welt{display:flex;margin:0 14px 18px;background:rgba(255,255,255,.08);border-radius:9px;padding:3px}
.welt button{flex:1;border:0;background:none;color:#9fb3c8;font-size:13.5px;font-weight:600;
  padding:7px 0;border-radius:7px}
.welt button.aktiv{background:#fff;color:var(--tinte)}

nav{padding:0 12px;flex:1;overflow-y:auto}
nav button{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:none;border:0;padding:11px 12px;border-radius:8px;
  color:#c3d0de;font-size:14.5px;margin-bottom:2px;
}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button.aktiv{background:var(--akzent);color:#fff;font-weight:600}
nav button .sym{width:18px;text-align:center;font-size:15px;opacity:.9}
nav button .zahl{margin-left:auto;font-size:12px;font-weight:700;
  background:rgba(255,255,255,.16);padding:1px 7px;border-radius:9px}
nav button.aktiv .zahl{background:rgba(255,255,255,.26)}

.leisten-fuss{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.leisten-fuss button{display:block;width:100%;text-align:left;background:none;border:0;
  color:#8da3b8;font-size:13px;padding:6px 12px;border-radius:7px}
.leisten-fuss button:hover{background:rgba(255,255,255,.07);color:#fff}
.leisten-fuss .fein{font-size:11.5px;color:#5b6b7d;padding:8px 12px 0;line-height:1.45}

.buehne{flex:1;min-width:0;display:flex;flex-direction:column}
.kopfleiste{
  height:60px;flex:0 0 60px;background:#fff;border-bottom:1px solid var(--rand);
  display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:20;
}
.kopfleiste select{
  font:inherit;font-size:14.5px;font-weight:600;color:var(--tinte);border:1px solid var(--rand);
  background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;
}
.kopf-rechts{margin-left:auto;display:flex;align-items:center;gap:16px}
.datum{font-size:13.5px;color:var(--g500)}
.inhalt{padding:28px;max-width:1120px;width:100%}

/* ============================ Bausteine ============================ */
.seitenkopf{margin-bottom:22px}
.seitenkopf h1{font-size:25px;font-weight:700;color:var(--tinte);margin:0 0 4px;letter-spacing:-.02em}
.seitenkopf p{margin:0;color:var(--g500);font-size:15px;max-width:640px}

.pille{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  padding:3px 10px;border-radius:20px;white-space:nowrap}
.pille .punkt{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.p-gruen{background:var(--gruen-hell);color:var(--gruen)}
.p-gelb{background:var(--gelb-hell);color:var(--gelb)}
.p-rot{background:var(--rot-hell);color:var(--rot)}
.p-blau{background:var(--akzent-hell);color:var(--akzent)}
.p-grau{background:var(--g100);color:var(--g500)}

/* schmale Kennzahlenzeile statt Kachelwand */
.lage{display:flex;gap:28px;flex-wrap:wrap;padding:14px 20px;background:#fff;
  border:1px solid var(--rand);border-radius:10px;box-shadow:var(--schatten);margin-bottom:18px}
.lage .punkt2{display:flex;flex-direction:column}
.lage .wert{font-size:22px;font-weight:700;color:var(--tinte);line-height:1.1;letter-spacing:-.02em}
.lage .wert small{font-size:13px;font-weight:600;color:var(--g400);margin-left:2px}
.lage .et{font-size:12.5px;color:var(--g500);margin-top:2px}
.lage .warn .wert{color:var(--rot)}

.karte{background:#fff;border:1px solid var(--rand);border-radius:10px;box-shadow:var(--schatten)}
.karte + .karte{margin-top:18px}
.karte-kopf{padding:15px 20px;border-bottom:1px solid var(--rand);display:flex;align-items:center;gap:10px}
.karte-kopf h2{font-size:15.5px;font-weight:700;color:var(--tinte);margin:0}
.karte-kopf .hinweis{font-size:13px;color:var(--g500);margin-left:auto}
.karte-koerper{padding:20px}

table{width:100%;border-collapse:collapse;font-size:14.5px}
thead th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--g500);font-weight:700;padding:11px 20px;background:var(--g50);border-bottom:1px solid var(--rand)}
tbody td{padding:13px 20px;border-bottom:1px solid var(--g100);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td .haupt{font-weight:600;color:var(--tinte)}
td .neben{font-size:13px;color:var(--g500)}
.rechts{text-align:right}
.zahl-sp{font-variant-numeric:tabular-nums}
tr.notfall td{background:var(--rot-hell)}
tr.notfall td:first-child{box-shadow:inset 3px 0 0 var(--rot)}

.knopf{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--rand);background:#fff;border-radius:8px;padding:9px 16px;
  font-size:14.5px;font-weight:600;color:var(--g700)}
.knopf:hover{background:var(--g50);border-color:var(--g300)}
.knopf.haupt{background:var(--akzent);border-color:var(--akzent);color:#fff}
.knopf.haupt:hover{background:var(--akzent-tief);border-color:var(--akzent-tief)}
.knopf.still{border-color:transparent;background:transparent;color:var(--akzent)}
.knopf.still:hover{background:var(--akzent-hell)}
.knopf.gross{padding:13px 22px;font-size:16px;border-radius:9px}
.knopf:disabled{opacity:.45;cursor:default}

.reiter{display:flex;gap:4px;border-bottom:1px solid var(--rand);margin-bottom:22px;flex-wrap:wrap}
.reiter button{background:none;border:0;padding:9px 14px;font-size:14.5px;font-weight:600;
  color:var(--g500);border-bottom:2px solid transparent;margin-bottom:-1px}
.reiter button:hover{color:var(--tinte)}
.reiter button.aktiv{color:var(--akzent);border-bottom-color:var(--akzent)}

.meldung{display:flex;align-items:flex-start;gap:12px;background:var(--akzent-hell);
  border:1px solid #cfe4ef;border-radius:10px;padding:14px 18px;margin-bottom:18px;font-size:15px;color:var(--akzent-tief)}
.meldung .sym{font-size:17px;line-height:1.3}
.hinweisbox{border:1px solid var(--rand);border-left:3px solid var(--gelb);background:var(--gelb-hell);
  border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:18px;font-size:14.5px;color:#6f4308}
.hinweisbox b{display:block;margin-bottom:2px}

.leer{padding:48px 20px;text-align:center;color:var(--g400)}
.leer .gross{font-size:30px;margin-bottom:8px}
.leer b{color:var(--g500);font-size:16px}

.fein{font-size:13px;color:var(--g400);margin-top:12px;line-height:1.5}

/* ============================ Raumtafel ============================ */
.raumgitter{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(236px,1fr))}
.raum{border:1px solid var(--rand);border-top:4px solid var(--g300);border-radius:10px;
  background:#fff;padding:16px 18px;box-shadow:var(--schatten);display:flex;flex-direction:column}
.raum.frei{border-top-color:var(--gruen)}
.raum.wartet{border-top-color:var(--akzent)}
.raum.arzt{border-top-color:var(--gelb)}
.raum.richten{border-top-color:var(--g300);background:var(--g50)}
.raum .rname{font-size:16px;font-weight:700;color:var(--tinte)}
.raum .rbeh{font-size:13px;color:var(--g500)}
.raum .rgeraet{display:inline-block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--akzent);font-weight:700;margin-top:4px}
.raum .rkoerper{flex:1;min-height:56px;padding-top:11px}
.raum .rpat{font-size:15px;color:var(--tinte);font-weight:600;line-height:1.35}
.raum .rzeit{font-size:13px;color:var(--g500);margin-top:3px}
.raum .rleer{font-size:14px;color:var(--g400)}
.raum .rakt{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}

/* ============================ Gerät ============================ */
.geraet{border:10px solid #1b2738;border-radius:20px;background:#fff;overflow:hidden;
  box-shadow:0 10px 30px rgba(15,23,42,.14);max-width:820px;margin:0 auto}
.geraet.breit{max-width:100%}
.geraet-kopf{background:var(--tinte);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
.geraet-kopf .wer{font-size:16px;font-weight:700}
.geraet-kopf .was{font-size:13px;color:#9fb3c8;margin-top:1px}
.geraet-kopf .rechts{margin-left:auto;font-size:12.5px;color:#9fb3c8;text-align:right;line-height:1.45}
.geraet-koerper{padding:20px 22px}
.block{border-bottom:1px solid var(--g100);padding:16px 0}
.block:first-child{padding-top:0}
.block:last-child{border-bottom:0;padding-bottom:0}
.block .btitel{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--g500);
  font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.block .btitel .mehr{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none;font-size:13px}

.wahl{display:flex;align-items:center;gap:13px;padding:10px 0;border-bottom:1px solid var(--g100);cursor:pointer}
.wahl:last-child{border-bottom:0}
.wahl .kasten{flex:0 0 20px;height:20px;border:1.5px solid var(--g300);border-radius:5px;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff}
.wahl.an .kasten{background:var(--akzent);border-color:var(--akzent)}
.wahl .txt{flex:1;min-width:0;font-size:15px;color:var(--tinte)}
.wahl .txt span{display:block;font-size:13px;color:var(--g500)}
.wahl .betrag{font-size:15px;font-weight:700;color:var(--tinte);font-variant-numeric:tabular-nums}
.wahl.an .betrag{color:var(--akzent)}
.summe{display:flex;align-items:baseline;gap:10px;padding-top:14px;margin-top:4px;border-top:1px solid var(--g200)}
.summe .et{font-size:14px;color:var(--g500)}
.summe .wt{margin-left:auto;font-size:23px;font-weight:700;color:var(--tinte);font-variant-numeric:tabular-nums}
.fertigleiste{background:var(--g50);border-top:1px solid var(--rand);padding:16px 22px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fertigleiste .hinweis{font-size:14px;color:var(--g500);flex:1;min-width:200px}

/* Patientenbildschirm */
.patient-schirm{padding:34px 38px;text-align:center}
.patient-schirm .schritt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--akzent);font-weight:700}
.patient-schirm h2{font-size:27px;font-weight:700;color:var(--tinte);margin:8px 0 10px;letter-spacing:-.02em}
.patient-schirm p{font-size:16.5px;color:var(--g600);margin:0 auto 24px;max-width:460px;line-height:1.6}
.pknopf{display:block;width:100%;max-width:420px;margin:0 auto 11px;border:1px solid var(--rand);
  background:#fff;border-radius:11px;padding:17px 20px;text-align:left;font-size:16.5px;
  font-weight:600;color:var(--tinte);display:flex;align-items:center;gap:12px}
.pknopf .pfeil{margin-left:auto;color:var(--g300);font-size:20px}
.pknopf.haupt{background:var(--akzent);border-color:var(--akzent);color:#fff;justify-content:center}
.pknopf.haupt .pfeil{color:rgba(255,255,255,.6)}
.pknopf .feld{flex:1;min-width:0}
.pknopf small{display:block;font-size:13px;font-weight:600;color:var(--g500);margin-bottom:2px;
  letter-spacing:.03em}
.punkte{display:flex;gap:7px;justify-content:center;margin-top:26px}
.punkte i{width:7px;height:7px;border-radius:50%;background:var(--g200)}
.punkte i.an{background:var(--akzent);width:22px;border-radius:4px}

.zeile-liste{list-style:none;margin:0;padding:0;font-size:15px}
.zeile-liste li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--g100)}
.zeile-liste li:last-child{border-bottom:0}
.zeile-liste li b{color:var(--tinte)}
.zeile-liste li .nebensatz{display:block;color:var(--g500);font-size:13.5px}
.zeile-liste li .haken{flex:0 0 18px;color:var(--gruen);font-weight:700}

.regel{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--g100);font-size:14.5px}
.regel:last-child{border-bottom:0}
.regel .anlass{flex:0 0 38%;color:var(--tinte);font-weight:600}
.regel .pfeil{color:var(--g300)}
.regel .wohin{flex:1;color:var(--g600)}

.schalter-zeile{display:flex;align-items:flex-start;gap:16px;padding:15px 0;border-bottom:1px solid var(--g100)}
.schalter-zeile:last-child{border-bottom:0;padding-bottom:0}
.schalter-zeile .txt{flex:1;min-width:0}
.schalter-zeile .txt b{display:block;color:var(--tinte);font-size:15px;font-weight:600}
.schalter-zeile .txt span{font-size:13.5px;color:var(--g500)}
.schalter{position:relative;width:42px;height:24px;flex:0 0 42px;border:0;border-radius:12px;
  background:var(--g300);padding:0;transition:background .15s}
.schalter::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.schalter.an{background:var(--akzent)}
.schalter.an::after{transform:translateX(18px)}
.schalter:disabled{opacity:.4;cursor:default}

.gitter2{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media (max-width:980px){.gitter2{grid-template-columns:1fr}}

.protokoll{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.75}
.protokoll .zeile{display:flex;gap:14px;padding:4px 0;border-bottom:1px solid var(--g100)}
.protokoll .zeile:last-child{border-bottom:0}
.protokoll .zeit{color:var(--g400);flex:0 0 76px}
.protokoll .art{flex:0 0 84px;font-weight:700}
.protokoll .a-ok{color:var(--gruen)} .protokoll .a-warn{color:var(--gelb)}
.protokoll .a-fehl{color:var(--rot)} .protokoll .a-info{color:var(--g500)}
.protokoll .text{flex:1;color:var(--g700)}

.menuknopf{display:none;background:none;border:1px solid var(--rand);border-radius:8px;padding:6px 11px}
@media (max-width:860px){
  .seitenleiste{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;z-index:60}
  .seitenleiste.offen{transform:translateX(0)}
  .inhalt{padding:18px}
  .kopfleiste{padding:0 16px}
  .menuknopf{display:inline-block}
}
</style>
</head>
<body>

<div class="huelle">
  <aside class="seitenleiste" id="seitenleiste">
    <div class="marke"><div class="wort">Prax<span>ora</span></div></div>
    <div class="welt" id="weltwahl">
      <button data-welt="praxis">Praxis</button>
      <button data-welt="patient">Patient</button>
    </div>
    <nav id="navigation"></nav>
    <div class="leisten-fuss">
      <button data-seite="vorhaben">Das Vorhaben im Überblick</button>
      <div class="fein">Vorführfassung · erfundene Daten</div>
    </div>
  </aside>

  <div class="buehne">
    <header class="kopfleiste">
      <button class="menuknopf" id="menuknopf">☰</button>
      <select id="mandantwahl"></select>
      <div class="kopf-rechts">
        <span class="datum" id="datumfeld"></span>
        <span class="pille p-gruen" id="bruecke-pille"><span class="punkt"></span>Duria² verbunden</span>
      </div>
    </header>
    <div class="inhalt" id="inhalt"></div>
  </div>
</div>

<script>
(function(){

    wiedervorlage: [

    Object.keys(PRAXEN).forEach(function(k){

/* ===================================================== Hilfsmittel */

function euro(n){
  return n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
}
function sicher(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function pille(art, text){
  return '<span class="pille p-' + art + '"><span class="punkt"></span>' + text + '</span>';
}
function kopf(titel, text){
  return '<div class="seitenkopf"><h1>' + titel + '</h1>' +
         (text ? '<p>' + text + '</p>' : '') + '</div>';
}
function karte(titel, hinweis, koerper){
  return '<section class="karte">' +
    (titel ? '<div class="karte-kopf"><h2>' + titel + '</h2>' +
             (hinweis ? '<span class="hinweis">' + hinweis + '</span>' : '') + '</div>' : '') +
    koerper + '</section>';
}
function lage(punkte){
  return '<div class="lage">' + punkte.map(function(p){
    return '<div class="punkt2' + (p.warn ? " warn" : "") + '">' +
      '<span class="wert">' + p.wert + (p.einheit ? '<small>' + p.einheit + '</small>' : '') + '</span>' +
      '<span class="et">' + p.et + '</span></div>';
  }).join("") + '</div>';
}
function leer(text, unter){
  return '<div class="leer"><div class="gross">◌</div><b>' + text + '</b>' +
         (unter ? '<div style="font-size:14.5px;margin-top:6px">' + unter + '</div>' : '') + '</div>';
}
function reiter(schluessel, punkte){
  var jetzt = reiterWert(schluessel, punkte[0].id);
  return '<div class="reiter">' + punkte.map(function(p){
    return '<button data-reiter="' + schluessel + '" data-wert="' + p.id + '"' +
           (p.id === jetzt ? ' class="aktiv"' : '') + '>' + p.titel + '</button>';
  }).join("") + '</div>';
}
function reiterWert(schluessel, standard){
  return zustand.reiter[schluessel] || standard;
}
function meldungsbalken(){
  return zustand.meldung
    ? '<div class="meldung"><span class="sym">↻</span><span>' + sicher(zustand.meldung) + '</span></div>'
    : "";
}

/* ===================================================== Räume */

function raeume(){
  if(!zustand.raumStand[zustand.mandant]){
    zustand.raumStand[zustand.mandant] = JSON.parse(JSON.stringify(RAEUME[zustand.mandant] || []));
  }
  return zustand.raumStand[zustand.mandant];
}
function warteliste(){
  if(!zustand.warteStand[zustand.mandant]){
    zustand.warteStand[zustand.mandant] = JSON.parse(JSON.stringify(WARTELISTE[zustand.mandant] || []));
  }
  return zustand.warteStand[zustand.mandant];
}

/* Notfall vor Wartezeit. Ein Raum mit Gerät wird nicht an jemanden vergeben,
   der das Gerät nicht braucht; ein geteilter Raum steht allen Behandlern offen. */
function vorrang(x,y){
  if(x.notfall !== y.notfall) return x.notfall ? -1 : 1;
  return y.seit - x.seit;
}
function fuerRaum(k){
  if(k.status !== "frei") return null;
  var liste = warteliste().filter(function(w){
    if(k.beh !== "geteilt" && w.beh !== k.beh) return false;
    return w.braucht ? k.geraet === w.braucht : k.geraet === null;
  });
  liste.sort(vorrang);
  return liste[0] || null;
}
/* Wer von allen Wartenden kommt als Nächstes dran, und in welchen Raum? */
function besteZuteilung(){
  var raum = null, pat = null;
  raeume().forEach(function(k){
    var w = fuerRaum(k);
    if(!w) return;
    if(!pat || vorrang(w, pat) < 0){ raum = k; pat = w; }
  });
  return pat ? {raum:raum, patient:pat} : null;
}
function zuteilen(t){
  if(!t) return false;
  t.raum.status = "wartet"; t.raum.pat = t.patient.name; t.raum.nr = t.patient.nr; t.raum.seit = 0;
  var w = warteliste();
  var i = w.map(function(x){ return x.nr; }).indexOf(t.patient.nr);
  if(i >= 0) w.splice(i,1);
  return true;
}
function raumHolen(id){
  var k = null;
  raeume().some(function(x){ if(x.id === id){ k = x; return true; } return false; });
  return k;
}
function nachruecken(id){
  var k = raumHolen(id);
  if(!k) return;
  var t = besteZuteilung();
  zustand.meldung = (t && zuteilen(t))
    ? t.patient.name + " wurde automatisch in " + t.raum.name + " gebeten" +
      (t.patient.notfall ? " — außer der Reihe, weil akut." : ".")
    : k.name + " ist frei. Es wartet gerade niemand Passendes.";
}
function raumFreigeben(id, abschluss){
  var k = raumHolen(id);
  if(!k) return;
  var name = k.pat || "Der Patient";
  k.status = "richten"; k.pat = null; k.nr = null; k.seit = 0;
  var t = besteZuteilung(), satz;
  if(t && zuteilen(t)){
    satz = t.patient.name + " wurde sofort in " + t.raum.name + " gebeten" +
           (t.patient.notfall ? " — außer der Reihe, weil akut." : ".");
  } else {
    satz = "Es wartet gerade niemand Passendes; " + k.name + " bleibt nach dem Herrichten frei.";
  }
  zustand.meldung = name + " ist fertig. " + satz;
  if(abschluss){
    zustand.zimmer = { leistungen:{}, rezepte:{}, diktat:false,
      abschluss:{ name:name, raum:k.name, naechster:satz,
                  summe:abschluss.summe, rezepte:abschluss.rezepte } };
  }
}

  richten: {art:"grau",  text:"wird hergerichtet"},
  wartet:  {art:"blau",  text:"Patient wartet"},

  erwartet: {art:"grau",  text:"erwartet"},

/* ------------------------------------------------------------ Der Tag */
ANSICHTEN.tag = function(){
  var p = praxis();
  var welcher = reiterWert("tag", "raeume");

  var r = raeume(), w = warteliste();
  var frei = r.filter(function(k){ return k.status === "frei"; }).length;
  var notfaelle = w.filter(function(k){ return k.notfall; }).length;
  var laengste = w.reduce(function(m,k){ return Math.max(m, k.seit); }, 0);
  var offeneBoegen = p.patienten.filter(function(x){
    return x.formular === "offen" && x.status !== "fertig"; }).length;

  var kopfzeile = kopf("Der Tag",
    "Ein Bildschirm für den ganzen Tag. Wer wartet, welcher Raum frei ist, wer dran ist.");

  var reiterzeile = reiter("tag", [
    {id:"raeume", titel:"Räume und Wartende"},
    {id:"liste",  titel:"Sprechstunde"}
  ]);

  /* --- Sprechstunde --- */
  if(welcher === "liste"){
    var zeilen = p.patienten.map(function(x){
      var s = STATUS[x.status];
      return '<tr>' +
        '<td class="zahl-sp" style="color:var(--g500)">' + x.zeit + '</td>' +
        '<td><div class="haupt">' + sicher(x.name) + '</div>' +
            '<div class="neben">Nr. ' + x.nr + ' · ' + x.art + '</div></td>' +
        '<td>' + sicher(x.anlass) + '</td>' +
        '<td>' + (x.formular === "fertig" ? pille("gruen","liegt vor") : pille("gelb","offen")) + '</td>' +
        '<td>' + pille(s.art, s.text) + '</td></tr>';
    }).join("");
    return kopfzeile + reiterzeile +
      lage([
        {wert:p.kennzahlen.erwartet, et:"Termine heute"},
        {wert:p.kennzahlen.angemeldet, et:"schon angemeldet"},
        {wert:offeneBoegen, et:"Bögen offen", warn:offeneBoegen > 0}
      ]) +
      karte("Sprechstunde", null,
        '<table><thead><tr><th>Zeit</th><th>Patient</th><th>Anlass</th>' +
        '<th>Bogen</th><th>Status</th></tr></thead><tbody>' + zeilen + '</tbody></table>');
  }

  /* --- Räume und Wartende --- */
  if(!p.module.raeume){
    return kopfzeile + reiterzeile +
      karte(null, null, '<div class="karte-koerper">' +
        leer("Raumzuteilung ist abgeschaltet",
             "Einzuschalten unter Einstellungen › Module.") + '</div>');
  }

  var tafel = r.map(function(k){
    var s = RAUM_ART[k.status], koerper, aktion = "";
    if(k.status === "frei"){
      var t = fuerRaum(k);
      koerper = '<div class="rleer">Niemand im Raum.</div>';
      aktion = t
        ? '<button class="knopf haupt" data-zuteilen="' + t.nr + '" data-raum="' + k.id + '">' +
          sicher(t.name) + ' hereinbitten</button>'
        : '<span class="rleer" style="font-size:13px">Niemand Passendes wartet.</span>';
    } else if(k.status === "richten"){
      koerper = '<div class="rleer">Wird hergerichtet.</div>';
      aktion = '<button class="knopf" data-fertigraum="' + k.id + '">Raum ist fertig</button>';
    } else if(k.status === "wartet"){
      koerper = '<div class="rpat">' + sicher(k.pat) + '</div>' +
                '<div class="rzeit">wartet seit ' + k.seit + ' Min.</div>';
      aktion = '<button class="knopf" data-betreten="' + k.id + '">Raum betreten</button>';
    } else {
      koerper = '<div class="rpat">' + sicher(k.pat) + '</div>' +
                '<div class="rzeit">im Gespräch seit ' + k.seit + ' Min.</div>';
      aktion = '<button class="knopf haupt" data-freigeben="' + k.id + '">Erledigt</button>';
    }
    return '<div class="raum ' + k.status + '">' +
      '<div class="rname">' + sicher(k.name) + '</div>' +
      '<div class="rbeh">' + sicher(k.beh) + '</div>' +
      (k.geraet ? '<div class="rgeraet">' + sicher(k.geraet) + '</div>' : '') +
      '<div style="margin-top:9px">' + pille(s.art, s.text) + '</div>' +
      '<div class="rkoerper">' + koerper + '</div>' +
      '<div class="rakt">' + aktion + '</div></div>';
  }).join("");

  var warten = w.length ? w.slice().sort(function(x,y){
      if(x.notfall !== y.notfall) return x.notfall ? -1 : 1;
      return y.seit - x.seit;
    }).map(function(k){
    var t = besteZuteilung();
    var dran = t && t.patient.nr === k.nr;
    return '<tr' + (k.notfall ? ' class="notfall"' : '') + '>' +
      '<td><div class="haupt">' + sicher(k.name) + '</div>' +
          '<div class="neben">' + sicher(k.beh) + '</div></td>' +
      '<td>' + sicher(k.anlass) +
          (k.braucht ? '<div class="neben">braucht ' + sicher(k.braucht) + '</div>' : '') + '</td>' +
      '<td>' + (k.notfall ? pille("rot","außer der Reihe") : pille("grau", k.seit + " Min.")) + '</td>' +
      '<td class="rechts">' + (dran
          ? '<button class="knopf haupt" data-zuteilen="' + k.nr + '">In ' + sicher(t.raum.name) + '</button>'
          : '<span style="color:var(--g400);font-size:13.5px">wartet auf einen Raum</span>') + '</td></tr>';
  }).join("") : '<tr><td colspan="4">' + leer("Niemand wartet") + '</td></tr>';

  var punkte = [
    {wert:w.length, et:"im Wartebereich"},
    {wert:frei + " von " + r.length, et:"Räume frei"},
    {wert:laengste, einheit:" Min.", et:"längste Wartezeit"}
  ];
  if(notfaelle) punkte.push({wert:notfaelle, et:"außer der Reihe", warn:true});

  return kopfzeile + reiterzeile + lage(punkte) + meldungsbalken() +
    karte("Räume", null, '<div class="karte-koerper"><div class="raumgitter">' + tafel + '</div>' +
      '<div class="fein">Namen der Behandler und die tatsächliche Raumaufteilung tragen wir ein, ' +
      'sobald sie von der Praxis vorliegen.</div></div>') +
    karte("Wartebereich", w.length + " Wartende",
      '<table><thead><tr><th>Patient</th><th>Anlass</th><th>Wartet</th>' +
      '<th class="rechts">Nächster Schritt</th></tr></thead><tbody>' + warten + '</tbody></table>');
};

/* ------------------------------------------------------------ Abrechnung */
ANSICHTEN.abrechnung = function(){
  var p = praxis();
  if(!p.module.abschluss){
    return kopf("Abrechnung", "In dieser Praxis noch nicht eingeschaltet.") +
      karte(null, null, '<div class="karte-koerper">' +
        leer("Selbstabschluss ist abgeschaltet", "Einzuschalten unter Einstellungen › Module.") + '</div>');
  }
  var f = reiterWert("rech","alle");
  var liste = p.rechnungen.filter(function(r){
    return f === "alle" ? true : (f === "offen" ? r.status !== "bezahlt" : r.status === f);
  });
  var offen = p.rechnungen.filter(function(r){ return r.status !== "bezahlt"; });
  var ueber = offen.filter(function(r){ return r.status === "ueberfaellig"; });
  var terminal = p.rechnungen.filter(function(r){ return r.weg === "Terminal"; });
  var sum = function(a){ return a.reduce(function(s,r){ return s + r.betrag; }, 0); };

  var zeilen = liste.length ? liste.map(function(r){
    var art = r.status === "bezahlt" ? "gruen" : (r.status === "offen" ? "gelb" : "rot");
    var txt = r.status === "bezahlt" ? "bezahlt" : (r.status === "offen" ? "offen" : "überfällig");
    return '<tr><td class="haupt zahl-sp">' + r.nr + '</td><td>' + sicher(r.pat) + '</td>' +
      '<td class="zahl-sp" style="color:var(--g500)">' + r.datum + '</td><td>' + r.weg + '</td>' +
      '<td>' + pille(art, txt) + '</td>' +
      '<td class="rechts zahl-sp haupt">' + euro(r.betrag) + '</td></tr>';
  }).join("") : '<tr><td colspan="6">' + leer("Nichts in dieser Auswahl") + '</td></tr>';

  return kopf("Abrechnung", "Was am Terminal bezahlt wird, wird nie zum offenen Posten.") +
    lage([
      {wert:euro(sum(terminal)), et:"am Terminal bezahlt"},
      {wert:euro(sum(offen)), et:offen.length + " Rechnungen offen"},
      {wert:euro(sum(ueber)), et:ueber.length + " überfällig", warn:ueber.length > 0}
    ]) +
    reiter("rech", [{id:"alle",titel:"Alle"},{id:"offen",titel:"Offen"},
                    {id:"ueberfaellig",titel:"Überfällig"},{id:"bezahlt",titel:"Bezahlt"}]) +
    karte("Rechnungen", liste.length + " von " + p.rechnungen.length,
      '<table><thead><tr><th>Nummer</th><th>Patient</th><th>Datum</th><th>Zustellung</th>' +
      '<th>Status</th><th class="rechts">Betrag</th></tr></thead><tbody>' + zeilen + '</tbody></table>');
};

/* ------------------------------------------------------------- Nachsorge */
ANSICHTEN.nachsorge = function(){
  var p = praxis();
  if(!p.module.wiedervorlage){
    return kopf("Nachsorge", "In dieser Praxis noch nicht eingeschaltet.") +
      karte(null, null, '<div class="karte-koerper">' +
        leer("Wiedervorlage ist abgeschaltet", "Einzuschalten unter Einstellungen › Module.") + '</div>');
  }
  var erl = zustand.erledigt[zustand.mandant] || {};
  var offen = p.wiedervorlage.filter(function(w){ return !erl[w.nr]; });
  var zeilen = offen.length ? offen.map(function(w){
    var art = w.faellig > 365 ? "rot" : (w.faellig > 180 ? "gelb" : "grau");
    return '<tr><td><div class="haupt">' + sicher(w.name) + '</div>' +
      '<div class="neben">' + w.alter + ' Jahre</div></td>' +

      '<button class="knopf still" data-erledigt-wv="' + w.nr + '">Erledigt</button></td></tr>';
  }).join("") : '<tr><td colspan="5">' +
      leer("Liste abgearbeitet", "Morgen früh steht die nächste bereit.") + '</td></tr>';

  return kopf("Nachsorge", "Vorsorgen, die fällig sind — und die noch niemand gebucht hat.") +
    lage([
      {wert:offen.length, et:"heute vorzulegen"},
      {wert:p.kennzahlen.faellig, et:"fällig im Bestand"},
      {wert:offen.filter(function(w){ return w.faellig > 365; }).length, et:"länger als ein Jahr",
       warn:offen.some(function(w){ return w.faellig > 365; })}

/* ===================================================== Einstellungen */

ANSICHTEN.einstellungen = function(){
  var p = praxis();
  var welcher = reiterWert("ein", "module");
  var leiste = reiter("ein", [
    {id:"module",    titel:"Module"},
    {id:"formulare", titel:"Formulare"},
    {id:"telefon",   titel:"Telefon"},
    {id:"bruecke",   titel:"Duria-Brücke"},
    {id:"gespraech", titel:"Gespräch"},
    {id:"praxis",    titel:"Praxisdaten"}
  ]);
  var k = kopf("Einstellungen", "Alles, was einmal eingerichtet und danach selten angefasst wird.");

  /* ---- Module ---- */
  if(welcher === "module"){
    var zeilen = [
      {m:"anmeldung",   b:"Selbstanmeldung",        t:"Terminal im Eingangsbereich"},
      {m:"anamnese",    b:"Digitale Anamnese",      t:"Handy vorab oder iPad im Wartezimmer"},
      {m:"aufklaerung", b:"Aufklärung mit Unterschrift", t:"Bogen auf dem iPad, fertig in die Akte"},
      {m:"raeume",      b:"Räume und Wartebereich", t:"Zuteilung der Wartenden, „Erledigt“ gibt den Raum frei"},
      {m:"diktat",      b:"Diktat im Zimmer",       t:"Gesprochenes wird zum Entwurf für die Karteikarte"},
      {m:"rezept",      b:"Rezept aus dem Zimmer",  t:"Auswahl im Zimmer, Ausstellung in Duria²"},
      {m:"abschluss",   b:"Selbstabschluss",        t:"Leistungen im Zimmer, Rechnung beim Gehen"},
      {m:"wiedervorlage",b:"Nachsorge",             t:"Tägliche Liste fälliger Vorsorgen"},
      {m:"telefon",     b:"Telefonannahme",         t:"Braucht eine digitale Telefonanlage"},
      {m:"transkript",  b:"Vollständige Gesprächsdokumentation",
       t:"Erst nach Einwilligung und Folgenabschätzung", sperre:true}
    ].map(function(z){
      var an = p.module[z.m];
      return '<div class="schalter-zeile"><div class="txt"><b>' + z.b + '</b><span>' + z.t + '</span></div>' +
        '<button class="schalter' + (an ? " an" : "") + '" data-modul="' + z.m + '"' +
        (z.sperre ? " disabled" : "") + ' aria-pressed="' + an + '"></button></div>';
    }).join("");
    return k + leiste + karte(null, null, '<div class="karte-koerper">' + zeilen +
      '<div class="fein">Dieselbe Software, andere Praxis. Was eine Praxis nutzt, entscheidet sie hier — ' +
      'es gibt keine zweite Fassung des Programms.</div></div>');
  }

  /* ---- Formulare ---- */
  if(welcher === "formulare"){
    var b = BOEGEN.map(function(x){
      var art = x.quelle === "Anbieter" ? "blau" : (x.quelle === "Praxis" ? "grau" : "gruen");
      return '<tr><td><div class="haupt">' + sicher(x.name) + '</div>' +
        '<div class="neben">' + x.felder + ' Felder · Stand ' + x.stand + '</div></td>' +
        '<td>' + sicher(x.anlass) + '</td><td>' + pille(art, x.quelle) + '</td>' +
        '<td class="rechts">' + pille("gruen","geht nach Duria²") + '</td></tr>';
    }).join("");
    return k + leiste + karte("Bögen im Umlauf", BOEGEN.length + " Bögen",
      '<table><thead><tr><th>Bogen</th><th>Anlass</th><th>Gepflegt von</th>' +
      '<th class="rechts">Rückweg</th></tr></thead><tbody>' + b + '</tbody></table>');
  }

  /* ---- Telefon ---- */
  if(welcher === "telefon"){
    var t = TELEFON[zustand.mandant];
    var digital = t.anlage === "digital";
    var quote = t.anrufe ? Math.round(t.automatisch / t.anrufe * 100) : 0;
    var regeln = TERMINREGELN.map(function(r){
      return '<div class="regel"><span class="anlass">' + sicher(r.anlass) + '</span>' +
        '<span class="pfeil">→</span><span class="wohin">' + sicher(r.wohin) + '</span></div>';
    }).join("");
    var nie = TELEFON_NIE.map(function(x){
      return '<li><span class="haken" style="color:var(--rot)">✕</span><span>' + sicher(x) + '</span></li>';
    }).join("");
    return k + leiste +
      (digital ? "" : '<div class="hinweisbox"><b>Voraussetzung fehlt: eine digitale Telefonanlage.</b>' +
        'An einer analogen Anlage lässt sich keine Annahme dazwischenschalten. Das ist eine Beauftragung ' +
        'beim Systemhaus — und sie sollte früh laufen, weil die Rufnummernübernahme Wochen dauert.</div>') +
      lage([
        {wert:t.anrufe, et:"Anrufe je Woche"},
        {wert:quote, einheit:" %", et:"automatisch erledigt"},
        {wert:t.verpasst, et:"nicht angenommen", warn:!digital}
      ]) +
      karte("Beim richtigen Behandler terminieren", "Regeln der Praxis",
        '<div class="karte-koerper">' + regeln +
        '<div class="fein">Diese Liste ist der eigentliche Wert. Heute steckt sie in den Köpfen der ' +
        'Anmeldung. Geschrieben kann sie jede Vertretung anwenden — und eine automatische Annahme auch.</div></div>') +
      karte("Was nie automatisch beantwortet wird", null,
        '<div class="karte-koerper"><ul class="zeile-liste">' + nie + '</ul></div>');
  }

  /* ---- Duria-Brücke ---- */
  if(welcher === "bruecke"){
    var br = p.bruecke;
    var felder = br.felder.map(function(f){
      var art = f.quelle === "erkannt" ? "blau" : (f.quelle === "Norm" ? "gruen" : "grau");
      return '<tr><td class="haupt zahl-sp">' + f.id + '</td><td>' + sicher(f.was) + '</td>' +
        '<td style="color:var(--g500)">' + sicher(f.wert) + '</td>' +
        '<td class="rechts">' + pille(art, f.quelle) + '</td></tr>';
    }).join("");
    var prot = br.protokoll.map(function(e){
      var txt = {ok:"ÜBERGEBEN", warn:"HINWEIS", fehl:"ANGEHALTEN", info:"BETRIEB"}[e.a];
      return '<div class="zeile"><span class="zeit">' + e.z + '</span>' +
        '<span class="art a-' + e.a + '">' + txt + '</span>' +
        '<span class="text">' + sicher(e.t) + '</span></div>';
    }).join("");
    return k + leiste +
      lage([
        {wert:br.zustand === "gut" ? "in Ordnung" : "gestört", et:"zuletzt " + br.letzte,
         warn:br.zustand !== "gut"},
        {wert:br.heute, et:"heute übergeben"},
        {wert:br.wartend, et:"in der Warteschlange"},
        {wert:br.modus, et:"Satzart " + br.satzart}
      ]) +
      karte("Feldzuordnung", sicher(br.verzeichnis),
        '<table><thead><tr><th>Feld</th><th>Bedeutung</th><th>Belegt mit</th>' +
        '<th class="rechts">Herkunft</th></tr></thead><tbody>' + felder + '</tbody></table>') +
      karte("Protokoll", "ohne Namen, nur Vorgangskennungen",
        '<div class="karte-koerper"><div class="protokoll">' + prot + '</div></div>');
  }

  /* ---- Gespräch ---- */
  if(welcher === "gespraech"){
    var links = GESPRAECH.ausschnitt.slice(0,4).map(function(z){
      return '<p style="margin:0 0 9px;font-size:14.5px;line-height:1.65"><b style="color:var(--g400)">' +
        z[0] + '</b> &nbsp;' + sicher(z[1]) + '</p>';
    }).join("");
    var rechts = GESPRAECH.entwurf.map(function(z){
      return '<div style="margin-bottom:13px"><b style="display:block;font-size:11px;letter-spacing:.05em;' +
        'text-transform:uppercase;color:var(--akzent)">' + z[0] + '</b>' +
        '<span style="font-size:14.5px;color:var(--tinte)">' + sicher(z[1]) + '</span></div>';
    }).join("");
    var pr = GESPRAECH_PRUEFUNG.map(function(z){
      var fertig = z.stand === "fertig";
      return '<div class="schalter-zeile"><div class="txt"><b>' + sicher(z.was) + '</b>' +
        '<span>' + sicher(z.warum) + '</span></div>' +
        '<div style="padding-top:2px">' + pille(fertig ? "gruen" : "gelb", z.hinweis) + '</div></div>';
    }).join("");
    var offen = GESPRAECH_PRUEFUNG.filter(function(z){ return z.stand === "offen"; }).length;
    return k + leiste +
      '<div class="hinweisbox"><b>Noch nicht freigegeben — das hier ist die Vorschau.</b>' +
      'In keiner Praxis wird aufgezeichnet. Ein Gespräch ohne Einwilligung aufzunehmen ist strafbar, ' +
      'nicht bloß heikel.</div>' +
      karte("Was dabei herauskommt", "erfundenes Beispiel",
        '<div class="karte-koerper gitter2">' +
        '<div><div style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--g500);' +
          'font-weight:700;margin-bottom:9px">Gesprochen</div>' + links + '</div>' +
        '<div><div style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--g500);' +
          'font-weight:700;margin-bottom:9px">Entwurf für die Karteikarte</div>' + rechts + '</div>' +
        '</div>') +
      karte("Was vorher erfüllt sein muss", offen + " von " + GESPRAECH_PRUEFUNG.length + " offen",
        '<div class="karte-koerper">' + pr + '</div>');
  }

  /* ---- Praxisdaten ---- */
  var daten = [
    ["Praxis", p.name], ["Ort", p.ort], ["Fachrichtung", p.fach],
    ["Behandler", p.behandler.join(", ")], ["Praxissoftware", p.pvs],
    ["Terminals", String(p.terminal)], ["iPads", String(p.ipads)]
  ].map(function(z){
    return '<li><span style="flex:0 0 150px;color:var(--g500)">' + z[0] + '</span>' +
           '<span style="color:var(--tinte);font-weight:600">' + sicher(z[1]) + '</span></li>';
  }).join("");
  return k + leiste + karte(null, null,
    '<div class="karte-koerper"><ul class="zeile-liste">' + daten + '</ul></div>');
};

/* ===================================================== Das Vorhaben */

ANSICHTEN.vorhaben = function(){
  var zeilen = VORHABEN.map(function(v){
    var s = STAND_ART[v.stand];
    return '<tr><td style="width:26%"><div class="haupt">' + sicher(v.wunsch) + '</div></td>' +
      '<td>' + sicher(v.text) + '</td>' +
      '<td style="width:13%">' + pille(s.art, s.text) + '</td>' +
      '<td style="width:14%;color:var(--g500)">' + sicher(v.wer) + '</td></tr>';
  }).join("");
  var zaehl = {};
  VORHABEN.forEach(function(v){ zaehl[v.stand] = (zaehl[v.stand]||0) + 1; });
  var laeuft = (zaehl.bereit||0) + (zaehl.laeuft||0);

  return kopf("Das Vorhaben",
      "Der Auftrag, wie er zu Beginn formuliert wurde — mit Stand und Zuständigkeit. " +
      "Nichts davon ist weggefallen.") +
    lage([
      {wert:VORHABEN.length, et:"Punkte im Auftrag"},
      {wert:laeuft, et:"steht oder läuft"},
      {wert:zaehl.gesperrt || 0, et:"blockiert", warn:(zaehl.gesperrt||0) > 0}
    ]) +
    karte("Auftrag und Stand", null,
      '<table><thead><tr><th>Wunsch</th><th>Wie wir ihn einlösen</th><th>Stand</th>' +
      '<th>Wer</th></tr></thead><tbody>' + zeilen + '</tbody></table>') +
    karte("Eine Schnittstelle, nicht fünf", null,
      '<div class="karte-koerper"><ul class="zeile-liste">' +
      '<li><span class="haken">·</span><span><b>Der verlässliche Weg in Duria² ist GDT.</b>' +
        '<span class="nebensatz">Duria² läuft auf InterSystems IRIS for Health, das HL7 FHIR grundsätzlich ' +
        'beherrscht. Ob Duria Dritten einen FHIR-Zugang öffnet, ist offen und beim DURIA-Support-Center ' +
        'zu erfragen. Verlassen können wir uns heute auf GDT — wie jeder andere Anbieter auch.</span></span></li>' +
      '<li><span class="haken">·</span><span><b>Deshalb gibt es genau eine Brücke.</b>' +
        '<span class="nebensatz">Anmeldung, Anamnese, Aufklärung, Rechnung und später das Gespräch gehen ' +
        'alle durch dieselbe. Ein Modul mehr heißt nicht eine Schnittstelle mehr.</span></span></li>' +
      '<li><span class="haken">·</span><span><b>Die Praxis hängt nicht von uns ab.</b>' +
        '<span class="nebensatz">Fällt die Verbindung nach außen weg, arbeitet sie weiter. ' +
        'Patientendaten verlassen das Haus nicht.</span></span></li>' +
      '</ul></div>');
};

/* ===================================================== Aufbau */

function navZeichnen(){
  var p = praxis();
  var erl = zustand.erledigt[zustand.mandant] || {};
  var zahlen = {
    tag: p.module.raeume ? warteliste().length : 0,
    abrechnung: p.module.abschluss
      ? p.rechnungen.filter(function(r){ return r.status !== "bezahlt"; }).length : 0,
    nachsorge: p.module.wiedervorlage
      ? p.wiedervorlage.filter(function(w){ return !erl[w.nr]; }).length : 0
  };
  document.getElementById("navigation").innerHTML = SEITEN[zustand.welt].map(function(s){
    var z = zahlen[s.id];
    return '<button data-seite="' + s.id + '"' + (zustand.seite === s.id ? ' class="aktiv"' : '') + '>' +
      '<span class="sym">' + s.sym + '</span>' + s.titel +
      (z ? '<span class="zahl">' + z + '</span>' : '') + '</button>';
  }).join("");
  var wahl = document.getElementById("weltwahl");
  Array.prototype.forEach.call(wahl.querySelectorAll("button"), function(b){
    b.className = b.getAttribute("data-welt") === zustand.welt ? "aktiv" : "";
  });
}

function kopfZeichnen(){
  var p = praxis();
  document.getElementById("mandantwahl").innerHTML = Object.keys(PRAXEN).map(function(k){
    return '<option value="' + k + '"' + (k === zustand.mandant ? " selected" : "") + '>' +
      sicher(PRAXEN[k].name) + ' — ' + sicher(PRAXEN[k].ort) + '</option>';
  }).join("");
  var d = new Date();
  var tage = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  document.getElementById("datumfeld").textContent =
    tage[d.getDay()] + ", " + d.toLocaleDateString("de-DE",{day:"2-digit",month:"long",year:"numeric"});
  var b = p.bruecke, pil = document.getElementById("bruecke-pille");
  pil.className = "pille " + (b.zustand === "gut" ? "p-gruen" : "p-gelb");
  pil.innerHTML = '<span class="punkt"></span>' +
    (b.zustand === "gut" ? "Duria² verbunden" : "Duria² gestört");
}

function zeichnen(){
  navZeichnen();
  kopfZeichnen();
  var f = ANSICHTEN[zustand.seite] || ANSICHTEN.tag;
  document.getElementById("inhalt").innerHTML = f();
  window.scrollTo(0,0);
}

function adresseSetzen(){
  try{
    var neu = "#" + zustand.mandant + "/" + zustand.seite;
    if(window.location.hash !== neu) window.history.replaceState(null, "", neu);
  }catch(e){ /* belanglos */ }
}
function adresseLesen(){
  var roh = (window.location.hash || "").replace(/^#/, "");
  if(!roh) return;
  var teile = roh.split("/");
  if(teile[0] && PRAXEN[teile[0]]) zustand.mandant = teile[0];
  if(teile[1] && ANSICHTEN[teile[1]]){
    zustand.seite = teile[1];
    zustand.welt = weltVon(teile[1]) || zustand.welt;
  }
}

/* ===================================================== Ereignisse */

document.addEventListener("click", function(e){
  var t = e.target, z;

  z = t.closest && t.closest("[data-welt]");
  if(z){
    zustand.welt = z.getAttribute("data-welt");
    zustand.seite = SEITEN[zustand.welt][0].id;
    adresseSetzen(); zeichnen(); return;
  }

  z = t.closest && t.closest("[data-seite]");
  if(z){
    if(z.tagName === "A") e.preventDefault();
    zustand.seite = z.getAttribute("data-seite");
    zustand.welt = weltVon(zustand.seite) || zustand.welt;
    document.getElementById("seitenleiste").classList.remove("offen");
    adresseSetzen(); zeichnen(); return;
  }

  z = t.closest && t.closest("[data-reiter]");
  if(z){ zustand.reiter[z.getAttribute("data-reiter")] = z.getAttribute("data-wert"); zeichnen(); return; }

  z = t.closest && t.closest("[data-modul]");
  if(z && !z.disabled){
    var m = z.getAttribute("data-modul");
    praxis().module[m] = !praxis().module[m];
    schalterSichern(); zeichnen(); return;
  }

  z = t.closest && t.closest("[data-zuteilen]");
  if(z){
    var nr = z.getAttribute("data-zuteilen"), rid = z.getAttribute("data-raum");
    var kand = null;
    warteliste().forEach(function(w){ if(w.nr === nr) kand = w; });
    var raum = rid ? raumHolen(rid) : null;
    var tr = (raum && kand) ? {raum:raum, patient:kand} : besteZuteilung();
    if(tr && tr.patient.nr === nr && zuteilen(tr)){
      zustand.meldung = tr.patient.name + " wartet jetzt in " + tr.raum.name + ".";
    }
    zeichnen(); return;
  }

  z = t.closest && t.closest("[data-fertigraum]");
  if(z){
    var id = z.getAttribute("data-fertigraum"), k = raumHolen(id);
    if(k){ k.status = "frei"; k.seit = 0; }
    nachruecken(id); zeichnen(); return;
  }

  z = t.closest && t.closest("[data-betreten]");
  if(z){
    var kb = raumHolen(z.getAttribute("data-betreten"));
    if(kb){ kb.status = "arzt"; kb.seit = 0; }
    zustand.zimmer = { leistungen:{}, rezepte:{}, diktat:false, abschluss:null };
    zustand.meldung = null;
    zustand.seite = "zimmer"; zustand.welt = "praxis";
    adresseSetzen(); zeichnen(); return;
  }

  z = t.closest && t.closest("[data-freigeben]");
  if(z){ raumFreigeben(z.getAttribute("data-freigeben"), null); zeichnen(); return; }

  z = t.closest && t.closest("[data-erledigt]");
  if(z){
    var zi = zustand.zimmer;
    var s = ZIMMER_LEISTUNGEN.reduce(function(a,l){
      var an = (l.id in zi.leistungen) ? zi.leistungen[l.id] : l.vor;
      return a + (an ? l.betrag : 0);
    }, 0);
    var anz = Object.keys(zi.rezepte).filter(function(x){ return zi.rezepte[x]; }).length;
    raumFreigeben(z.getAttribute("data-erledigt"), {summe:s, rezepte:anz});
    zeichnen(); return;
  }

  z = t.closest && t.closest("[data-leistung]");
  if(z){
    var li = z.getAttribute("data-leistung"), vor = false;
    ZIMMER_LEISTUNGEN.forEach(function(l){ if(l.id === li) vor = l.vor; });
    var jetzt = (li in zustand.zimmer.leistungen) ? zustand.zimmer.leistungen[li] : vor;
    zustand.zimmer.leistungen[li] = !jetzt; zeichnen(); return;
  }

  z = t.closest && t.closest("[data-rezept]");
  if(z){
    var ri = z.getAttribute("data-rezept");
    zustand.zimmer.rezepte[ri] = !zustand.zimmer.rezepte[ri]; zeichnen(); return;
  }

  z = t.closest && t.closest("[data-diktat]");
  if(z){ zustand.zimmer.diktat = true; zeichnen(); return; }

  z = t.closest && t.closest("[data-zuruecksetzen]");
  if(z){
    delete zustand.raumStand[zustand.mandant];
    delete zustand.warteStand[zustand.mandant];
    zustand.zimmer = { leistungen:{}, rezepte:{}, diktat:false, abschluss:null };
    zustand.meldung = null; zeichnen(); return;
  }

  z = t.closest && t.closest("[data-erledigt-wv]");
  if(z){
    var wv = z.getAttribute("data-erledigt-wv");
    if(!zustand.erledigt[zustand.mandant]) zustand.erledigt[zustand.mandant] = {};
    zustand.erledigt[zustand.mandant][wv] = true; zeichnen(); return;
  }

  z = t.closest && t.closest("[data-erinnern]");
  if(z){ z.textContent = "Vorgemerkt"; z.disabled = true; return; }

  if(t.id === "menuknopf"){
    document.getElementById("seitenleiste").classList.toggle("offen"); return;
  }
});

document.getElementById("mandantwahl").addEventListener("change", function(e){
  zustand.mandant = e.target.value;
  zustand.reiter = {}; zustand.meldung = null;
  zustand.zimmer = { leistungen:{}, rezepte:{}, diktat:false, abschluss:null };
  adresseSetzen(); zeichnen();
});

/* ===================================================== Start */
schalterLaden();
adresseLesen();
adresseSetzen();
zeichnen();

})();
</script>
</body>
</html>
