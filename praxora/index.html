<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praxora — Praxis-Cockpit</title>
<meta name="description" content="Das Cockpit für Praxen mit Duria². Selbstanmeldung, Formulare, Abschluss, Wiedervorlage und der Rückweg in die Karteikarte.">
<style>
:root{
  --tinte:#0f172a;
  --g900:#1e293b; --g700:#334155; --g600:#475569; --g500:#64748b;
  --g400:#94a3b8; --g300:#cbd5e1; --g200:#e2e8f0; --g100:#f1f5f9; --g50:#f8fafc;
  --akzent:#0b6e99; --akzent-tief:#074b69; --akzent-hell:#e9f3f8;
  --gruen:#0f7a55; --gruen-hell:#e7f5ef;
  --gelb:#a1620a; --gelb-hell:#fdf4e3;
  --rot:#b02a2a;  --rot-hell:#fbecec;
  --rand:#e4e9ef;
  --schatten:0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
  --kopf:56px; --leiste:232px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.5; color:var(--g700); background:var(--g50);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--akzent);text-decoration:none}
a:hover{text-decoration:underline}

/* ===================== Gerüst ===================== */
.huelle{display:flex;min-height:100vh}

.seitenleiste{
  width:var(--leiste); flex:0 0 var(--leiste);
  background:var(--tinte); color:#cdd8e4;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.marke{padding:18px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.marke .wort{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.01em}
.marke .wort span{color:#5eb3d6}
.marke .unter{font-size:11px;color:#7d8ea1;margin-top:2px;letter-spacing:.04em}

nav{padding:10px 10px;flex:1;overflow-y:auto}
nav .gruppe{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#64748b;
  padding:14px 10px 6px;font-weight:600}
nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;padding:8px 10px;border-radius:6px;
  color:#b6c4d3;font-size:13.5px;margin-bottom:1px;
}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button.aktiv{background:var(--akzent);color:#fff;font-weight:600}
nav button .sym{width:16px;text-align:center;font-size:14px;opacity:.85}
nav button .zahl{margin-left:auto;font-size:11px;font-weight:700;
  background:rgba(255,255,255,.14);padding:1px 6px;border-radius:9px}
nav button.aktiv .zahl{background:rgba(255,255,255,.25)}

.leisten-fuss{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#64748b}

.buehne{flex:1;min-width:0;display:flex;flex-direction:column}

.kopfleiste{
  height:var(--kopf);flex:0 0 var(--kopf);background:#fff;border-bottom:1px solid var(--rand);
  display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:20;
}
.mandant{display:flex;align-items:center;gap:9px}
.mandant select{
  font:inherit;font-weight:600;color:var(--tinte);border:1px solid var(--rand);
  background:#fff;border-radius:6px;padding:5px 9px;cursor:pointer;
}
.kopf-rechts{margin-left:auto;display:flex;align-items:center;gap:14px}
.datum{font-size:12.5px;color:var(--g500)}

.pille{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:20px;white-space:nowrap}
.pille .punkt{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.p-gruen{background:var(--gruen-hell);color:var(--gruen)}
.p-gelb{background:var(--gelb-hell);color:var(--gelb)}
.p-rot{background:var(--rot-hell);color:var(--rot)}
.p-blau{background:var(--akzent-hell);color:var(--akzent)}
.p-grau{background:var(--g100);color:var(--g500)}

.inhalt{padding:24px;max-width:1180px;width:100%}

/* ===================== Bausteine ===================== */
.seitenkopf{margin-bottom:20px}
.seitenkopf h1{font-size:21px;font-weight:700;color:var(--tinte);margin:0 0 3px;letter-spacing:-.015em}
.seitenkopf p{margin:0;color:var(--g500);font-size:13.5px;max-width:720px}

.karte{background:#fff;border:1px solid var(--rand);border-radius:9px;box-shadow:var(--schatten)}
.karte + .karte{margin-top:16px}
.karte-kopf{padding:14px 18px;border-bottom:1px solid var(--rand);display:flex;align-items:center;gap:10px}
.karte-kopf h2{font-size:14px;font-weight:700;color:var(--tinte);margin:0}
.karte-kopf .hinweis{font-size:12px;color:var(--g500);margin-left:auto}
.karte-koerper{padding:18px}
.karte-fuss{padding:11px 18px;border-top:1px solid var(--rand);background:var(--g50);
  border-radius:0 0 9px 9px;font-size:12.5px;color:var(--g500)}

.gitter{display:grid;gap:16px;align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}}

.kennzahl{background:#fff;border:1px solid var(--rand);border-radius:9px;padding:15px 17px;box-shadow:var(--schatten)}
.kennzahl .etikett{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--g500);font-weight:600}
.kennzahl .wert{font-size:27px;font-weight:700;color:var(--tinte);line-height:1.15;margin:6px 0 2px;letter-spacing:-.02em}
.kennzahl .wert small{font-size:14px;font-weight:600;color:var(--g400);margin-left:3px}
.kennzahl .fuss{font-size:12px;color:var(--g500)}
.kennzahl .fuss b{color:var(--gruen)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--g500);font-weight:700;padding:10px 18px;background:var(--g50);
  border-bottom:1px solid var(--rand)}
tbody td{padding:11px 18px;border-bottom:1px solid var(--g100);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.klickbar{cursor:pointer}
tbody tr.klickbar:hover{background:var(--g50)}
td .haupt{font-weight:600;color:var(--tinte)}
td .neben{font-size:12px;color:var(--g500)}
.rechts{text-align:right}
.zahl-sp{font-variant-numeric:tabular-nums}

.knopf{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rand);background:#fff;
  border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--g700);
}
.knopf:hover{background:var(--g50);border-color:var(--g300)}
.knopf.haupt{background:var(--akzent);border-color:var(--akzent);color:#fff}
.knopf.haupt:hover{background:var(--akzent-tief);border-color:var(--akzent-tief)}
.knopf.klein{padding:4px 9px;font-size:12px}
.knopf.still{border-color:transparent;background:transparent;color:var(--akzent)}
.knopf.still:hover{background:var(--akzent-hell)}
.knopf:disabled{opacity:.45;cursor:default}

.reiter{display:flex;gap:2px;border-bottom:1px solid var(--rand);margin-bottom:18px}
.reiter button{background:none;border:0;padding:8px 13px;font-size:13.5px;font-weight:600;
  color:var(--g500);border-bottom:2px solid transparent;margin-bottom:-1px}
.reiter button:hover{color:var(--tinte)}
.reiter button.aktiv{color:var(--akzent);border-bottom-color:var(--akzent)}

/* Schalter */
.schalter-zeile{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--g100)}
.schalter-zeile:last-child{border-bottom:0;padding-bottom:0}
.schalter-zeile .txt{flex:1;min-width:0}
.schalter-zeile .txt b{display:block;color:var(--tinte);font-size:13.5px;font-weight:600}
.schalter-zeile .txt span{font-size:12.5px;color:var(--g500)}
.schalter{position:relative;width:38px;height:22px;flex:0 0 38px;border:0;border-radius:11px;
  background:var(--g300);padding:0;transition:background .15s}
.schalter::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.schalter.an{background:var(--akzent)}
.schalter.an::after{transform:translateX(16px)}
.schalter:disabled{opacity:.4;cursor:default}

/* Ablaufkette */
.kette{display:flex;flex-wrap:wrap;align-items:stretch;gap:0}
.kette .glied{flex:1;min-width:120px;border:1px solid var(--rand);border-right:0;padding:12px 14px;background:#fff}
.kette .glied:first-child{border-radius:7px 0 0 7px}
.kette .glied:last-child{border-right:1px solid var(--rand);border-radius:0 7px 7px 0}
.kette .glied.aus{background:var(--g50);color:var(--g400)}
.kette .glied .nr{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--g400);font-weight:700}
.kette .glied.an .nr{color:var(--akzent)}
.kette .glied b{display:block;font-size:13px;color:var(--tinte);margin-top:3px}
.kette .glied.aus b{color:var(--g400)}
.kette .glied span{font-size:11.5px;color:var(--g500)}
.kette .glied.aus span{color:var(--g400)}

/* Protokoll */
.protokoll{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.2px;line-height:1.75}
.protokoll .zeile{display:flex;gap:12px;padding:3px 0;border-bottom:1px solid var(--g100)}
.protokoll .zeile:last-child{border-bottom:0}
.protokoll .zeit{color:var(--g400);flex:0 0 74px}
.protokoll .art{flex:0 0 78px;font-weight:700}
.protokoll .a-ok{color:var(--gruen)} .protokoll .a-warn{color:var(--gelb)}
.protokoll .a-fehl{color:var(--rot)} .protokoll .a-info{color:var(--g500)}
.protokoll .text{flex:1;color:var(--g700)}

/* Hinweisbox */
.box{border:1px solid var(--rand);border-left:3px solid var(--akzent);background:var(--akzent-hell);
  border-radius:0 7px 7px 0;padding:13px 16px;font-size:13px;color:var(--akzent-tief)}
.box b{display:block;margin-bottom:2px;color:var(--akzent-tief)}
.box.warn{border-left-color:var(--gelb);background:var(--gelb-hell);color:#6f4308;border-color:#f0e3c8}
.box.warn b{color:#6f4308}

.liste-schlicht{list-style:none;margin:0;padding:0;font-size:13.5px}
.liste-schlicht li{position:relative;padding:5px 0 5px 20px;color:var(--g600)}
.liste-schlicht li::before{content:"";position:absolute;left:2px;top:12px;width:6px;height:6px;
  border-radius:50%;background:var(--akzent)}
.liste-schlicht li b{color:var(--tinte)}

/* Raumtafel */
.raumgitter{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(212px,1fr))}
.raum{border:1px solid var(--rand);border-top:3px solid var(--g300);border-radius:8px;
  background:#fff;padding:12px 14px;box-shadow:var(--schatten);display:flex;flex-direction:column}
.raum.frei{border-top-color:var(--gruen)}
.raum.wartet{border-top-color:var(--akzent)}
.raum.arzt{border-top-color:var(--gelb)}
.raum.richten{border-top-color:var(--g300);background:var(--g50)}
.raum .rname{font-size:13.5px;font-weight:700;color:var(--tinte)}
.raum .rbeh{font-size:11.5px;color:var(--g500);margin-bottom:9px}
.raum .rkoerper{flex:1;min-height:46px}
.raum .rpat{font-size:13px;color:var(--tinte);font-weight:600;line-height:1.35}
.raum .rzeit{font-size:11.5px;color:var(--g500);margin-top:2px}
.raum .rleer{font-size:12.5px;color:var(--g400);padding-top:4px}
.raum .rakt{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.raum .rgeraet{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--akzent);font-weight:700;margin-top:3px}

tr.notfall td{background:var(--rot-hell)}
tr.notfall td:first-child{box-shadow:inset 3px 0 0 var(--rot)}

/* Gerät (iPad im Zimmer) */
.geraet{border:9px solid #1b2738;border-radius:16px;background:#fff;overflow:hidden;
  box-shadow:0 8px 26px rgba(15,23,42,.15);max-width:880px}
.geraet-kopf{background:var(--tinte);color:#fff;padding:11px 16px;display:flex;align-items:center;gap:12px}
.geraet-kopf .wer{font-size:14.5px;font-weight:700}
.geraet-kopf .was{font-size:12px;color:#9fb3c8}
.geraet-kopf .rechts{margin-left:auto;font-size:11.5px;color:#9fb3c8;text-align:right}
.geraet-koerper{padding:16px 18px}
.block{border-bottom:1px solid var(--g100);padding:13px 0}
.block:first-child{padding-top:0}
.block:last-child{border-bottom:0;padding-bottom:0}
.block .btitel{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--g500);
  font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.block .btitel .mehr{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none;font-size:12px}

.wahl{display:flex;align-items:center;gap:11px;padding:7px 0;border-bottom:1px solid var(--g100);cursor:pointer}
.wahl:last-child{border-bottom:0}
.wahl .kasten{flex:0 0 17px;height:17px;border:1.5px solid var(--g300);border-radius:4px;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:#fff}
.wahl.an .kasten{background:var(--akzent);border-color:var(--akzent)}
.wahl .txt{flex:1;min-width:0;font-size:13.5px;color:var(--tinte)}
.wahl .txt span{display:block;font-size:12px;color:var(--g500)}
.wahl .betrag{font-size:13.5px;font-weight:700;color:var(--tinte);font-variant-numeric:tabular-nums}
.wahl.an .betrag{color:var(--akzent)}

.summe{display:flex;align-items:baseline;gap:10px;padding-top:11px;margin-top:4px;border-top:1px solid var(--g200)}
.summe .et{font-size:12.5px;color:var(--g500)}
.summe .wt{margin-left:auto;font-size:19px;font-weight:700;color:var(--tinte);font-variant-numeric:tabular-nums}

.fertigleiste{background:var(--g50);border-top:1px solid var(--rand);padding:13px 18px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fertigleiste .hinweis{font-size:12.5px;color:var(--g500);flex:1;min-width:180px}

/* Telefonregeln */
.regel{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--g100);font-size:13.5px}
.regel:last-child{border-bottom:0}
.regel .anlass{flex:0 0 40%;color:var(--tinte);font-weight:600}
.regel .pfeil{color:var(--g300);flex:0 0 auto}
.regel .wohin{flex:1;color:var(--g600)}

/* Gegenüberstellung Gespräch / Karteikarteneintrag */
.gegenueber{display:flex;border:1px solid var(--rand);border-radius:7px;overflow:hidden}
.gegenueber > div{flex:1;padding:15px 17px;min-width:0}
.gegenueber > div + div{border-left:1px solid var(--rand);background:var(--g50)}
.gegenueber .titel{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--g500);font-weight:700;margin-bottom:9px}
.gespraech-text{font-size:13px;line-height:1.75;color:var(--g600)}
.gespraech-text .wer{color:var(--g400);font-weight:700}
.eintrag .feld{margin-bottom:11px}
.eintrag .feld:last-child{margin-bottom:0}
.eintrag .feld b{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--akzent);margin-bottom:2px;font-weight:700}
.eintrag .feld span{font-size:13px;line-height:1.55;color:var(--tinte);display:block}
@media (max-width:900px){.gegenueber{flex-direction:column}
  .gegenueber > div + div{border-left:0;border-top:1px solid var(--rand)}}

/* Prüfliste */
.pruefzeile{display:flex;align-items:flex-start;gap:14px;padding:11px 0;border-bottom:1px solid var(--g100)}
.pruefzeile:last-child{border-bottom:0;padding-bottom:0}
.pruefzeile .txt{flex:1;min-width:0}
.pruefzeile .txt b{display:block;color:var(--tinte);font-size:13.5px;font-weight:600}
.pruefzeile .txt span{font-size:12.5px;color:var(--g500)}
.pruefzeile .stand{flex:0 0 auto;padding-top:2px}

.leer{padding:44px 20px;text-align:center;color:var(--g400)}
.leer .gross{font-size:26px;margin-bottom:6px}

/* Schublade */
.schleier{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:50;display:none}
.schleier.offen{display:block}
.schublade{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:#fff;
  z-index:51;box-shadow:-6px 0 24px rgba(15,23,42,.13);transform:translateX(100%);
  transition:transform .18s ease;display:flex;flex-direction:column}
.schublade.offen{transform:translateX(0)}
.schublade-kopf{padding:16px 20px;border-bottom:1px solid var(--rand);display:flex;align-items:flex-start;gap:12px}
.schublade-kopf h3{margin:0;font-size:16px;color:var(--tinte)}
.schublade-kopf .neben{font-size:12.5px;color:var(--g500);margin-top:2px}
.schublade-kopf .zu{margin-left:auto;background:none;border:0;font-size:20px;color:var(--g400);line-height:1;padding:0 2px}
.schublade-koerper{padding:18px 20px;overflow-y:auto;flex:1}
.paar{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--g100);font-size:13.5px}
.paar:last-child{border-bottom:0}
.paar .k{flex:0 0 140px;color:var(--g500)}
.paar .v{flex:1;color:var(--tinte);font-weight:500}

.feinzeile{font-size:12px;color:var(--g400);margin-top:10px}

@media (max-width:820px){
  .seitenleiste{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;z-index:60}
  .seitenleiste.offen{transform:translateX(0)}
  .inhalt{padding:16px}
  .kopfleiste{padding:0 14px}
}
.menuknopf{display:none;background:none;border:1px solid var(--rand);border-radius:6px;padding:4px 9px}
@media (max-width:820px){.menuknopf{display:inline-block}}
</style>
</head>
<body>

<div class="huelle">

  <aside class="seitenleiste" id="seitenleiste">
    <div class="marke">
      <div class="wort">Prax<span>ora</span></div>
      <div class="unter">Praxis-Cockpit</div>
    </div>
    <nav id="navigation"></nav>
    <div class="leisten-fuss">
      Vorführfassung 0.1<br>Erfundene Daten, nichts wird gespeichert.
    </div>
  </aside>

  <div class="buehne">
    <header class="kopfleiste">
      <button class="menuknopf" id="menuknopf">☰</button>
      <div class="mandant">
        <span style="font-size:12px;color:var(--g500)">Praxis</span>
        <select id="mandantwahl"></select>
      </div>
      <div class="kopf-rechts">
        <span class="datum" id="datumfeld"></span>
        <span class="pille p-gruen" id="bruecke-pille"><span class="punkt"></span>Duria² verbunden</span>
      </div>
    </header>
    <div class="inhalt" id="inhalt"></div>
  </div>

</div>

<div class="schleier" id="schleier"></div>
<aside class="schublade" id="schublade"></aside>

<script>
(function(){
"use strict";

/* ==========================================================================
   Praxora — Praxis-Cockpit, Vorführfassung.
   Eine Datei, kein Server. Alle Daten sind erfunden.
   Das Cockpit zeigt, was in der Praxis passiert; die Arbeit macht der
   Agent auf dem Praxisrechner, der nach Duria² zurückschreibt.
   ========================================================================== */

/* --------------------------------------------------------------- Stammdaten */

var PRAXEN = {

  rheinderma: {
    name: "RHEINDERMA", ort: "Krefeld", fach: "Dermatologie",
    behandler: ["Dr. Lodin"],
    pvs: "Duria² — GDT 3.0", terminal: 1, ipads: 4,
    module: { anmeldung:true, anamnese:true, aufklaerung:true, abschluss:true,
              wiedervorlage:true, raeume:true, diktat:true, rezept:true,
              telefon:false, transkript:false },
    kennzahlen: { erwartet:38, angemeldet:23, schnitt:"1:47", quote:71,
                  offenAnzahl:14, offenBetrag:4380.50, faellig:57 },
    patienten: [
      {nr:"10234", name:"J. M.-Lüdenscheidt", zeit:"10:40", art:"Privat", anlass:"Hautkrebsvorsorge",

/* Räume und Warteliste werden im Betrieb verändert. Damit die Vorführung
   nicht die Stammdaten überschreibt, arbeitet sie auf einer Kopie. */
function raeume(){
  if(!zustand.raumStand[zustand.mandant]){
    zustand.raumStand[zustand.mandant] = JSON.parse(JSON.stringify(RAEUME[zustand.mandant] || []));
  }
  return zustand.raumStand[zustand.mandant];
}
function warteliste(){
  if(!zustand.warteStand[zustand.mandant]){
    zustand.warteStand[zustand.mandant] = JSON.parse(JSON.stringify(WARTELISTE[zustand.mandant] || []));
  }
  return zustand.warteStand[zustand.mandant];
}

/* Wer kommt als Nächstes in welchen Raum?
   Notfall vor Wartezeit. Ein gerätegebundener Raum wird nicht für einen
   Patienten belegt, der das Gerät nicht braucht. */
function naechsteZuteilung(beh){
  var liste = warteliste().filter(function(w){ return !beh || w.beh === beh; });
  liste.sort(function(x,y){
    if(x.notfall !== y.notfall) return x.notfall ? -1 : 1;
    return y.seit - x.seit;
  });
  var r = raeume(), treffer = null;
  liste.some(function(w){
    var raum = null;
    r.some(function(k){
      if(k.status !== "frei") return false;
      if(k.beh !== w.beh && k.beh !== "geteilt") return false;
      if(w.braucht ? k.geraet !== w.braucht : k.geraet !== null) return false;
      raum = k; return true;
    });
    if(raum){ treffer = {raum:raum, patient:w}; return true; }
    return false;
  });
  return treffer;
}

function zuteilen(treffer){
  if(!treffer) return false;
  treffer.raum.status = "wartet";
  treffer.raum.pat = treffer.patient.name;
  treffer.raum.nr  = treffer.patient.nr;
  treffer.raum.seit = 0;
  var w = warteliste();
  var i = w.map(function(x){ return x.nr; }).indexOf(treffer.patient.nr);
  if(i >= 0) w.splice(i,1);
  return true;
}

function praxis(){ return PRAXEN[zustand.mandant]; }

/* Modulschalter überleben einen Neuladen, wenn der Browser es zulässt. */
function schalterLaden(){
  try{
    var roh = window.localStorage.getItem("praxora.module");
    if(!roh) return;
    var g = JSON.parse(roh);
    Object.keys(PRAXEN).forEach(function(k){
      if(g[k]) Object.keys(g[k]).forEach(function(m){
        if(m in PRAXEN[k].module) PRAXEN[k].module[m] = !!g[k][m];
      });
    });
  }catch(e){ /* privates Fenster, blockierte Daten — egal */ }
}
function schalterSichern(){
  try{
    var g = {};
    Object.keys(PRAXEN).forEach(function(k){ g[k] = PRAXEN[k].module; });
    window.localStorage.setItem("praxora.module", JSON.stringify(g));
  }catch(e){ /* egal */ }
}

function euro(n){
  return n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
}
function sicher(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function pille(art, text){
  return '<span class="pille p-' + art + '"><span class="punkt"></span>' + text + '</span>';
}
function karte(titel, hinweis, koerper, fuss){
  return '<section class="karte">' +
    (titel ? '<div class="karte-kopf"><h2>' + titel + '</h2>' +
             (hinweis ? '<span class="hinweis">' + hinweis + '</span>' : '') + '</div>' : '') +
    koerper +
    (fuss ? '<div class="karte-fuss">' + fuss + '</div>' : '') +
    '</section>';
}
function kennzahl(etikett, wert, einheit, fuss){
  return '<div class="kennzahl"><div class="etikett">' + etikett + '</div>' +
    '<div class="wert">' + wert + (einheit ? '<small>' + einheit + '</small>' : '') + '</div>' +
    '<div class="fuss">' + (fuss||"") + '</div></div>';
}
function kopf(titel, text){
  return '<div class="seitenkopf"><h1>' + titel + '</h1><p>' + text + '</p></div>';
}
function leer(text, unter){
  return '<div class="leer"><div class="gross">◌</div><div><b>' + text + '</b></div>' +
         (unter ? '<div style="font-size:13px;margin-top:4px">' + unter + '</div>' : '') + '</div>';
}
function reiter(schluessel, punkte){
  var jetzt = zustand.reiter[schluessel] || punkte[0].id;
  return '<div class="reiter">' + punkte.map(function(p){
    return '<button data-reiter="' + schluessel + '" data-wert="' + p.id + '"' +
           (p.id === jetzt ? ' class="aktiv"' : '') + '>' + p.titel + '</button>';
  }).join("") + '</div>';
}
function reiterWert(schluessel, standard){
  return zustand.reiter[schluessel] || standard;
}

  var ueber = p.rechnungen.filter(function(r){ return r.status === "ueberfaellig"; });
  var summeOffen = offen.reduce(function(s,r){ return s + r.betrag; }, 0);
  var summeUeber = ueber.reduce(function(s,r){ return s + r.betrag; }, 0);
  var amTerminal = p.rechnungen.filter(function(r){ return r.weg === "Terminal"; });

  var zeilen = liste.length ? liste.map(function(r){

      '<td>' + r.weg + '</td>' +
      '<td>' + pille(art, txt) + '</td>' +

      "steht nie auf dieser Liste — es wird zu keinem offenen Posten.") +

      kennzahl("Am Terminal bezahlt", euro(summeTerminal), "",

      kennzahl("Offen insgesamt", euro(summeOffen), "",
               offen.length + " Rechnungen unterwegs, davon " + ueber.length + " überfällig") +
      kennzahl("Davon überfällig", euro(summeUeber), "", "länger als 30 Tage unbezahlt") +
      kennzahl("Mahnlauf", k.offenAnzahl, "", "Vorgänge in Beobachtung") +
    '</div>' +
    reiter("rechnungen", [
      {id:"alle", titel:"Alle"}, {id:"offen", titel:"Offen"},
      {id:"ueberfaellig", titel:"Überfällig"}, {id:"bezahlt", titel:"Bezahlt"}

    karte("Rechnungen", liste.length + " von " + p.rechnungen.length,
      '<table><thead><tr><th>Nummer</th><th>Patient</th><th>Datum</th><th>Zustellung</th>' +
      '<th>Status</th><th class="rechts">Betrag</th></tr></thead><tbody>' + zeilen + '</tbody></table>',

/* ------------------------------------------- Wartebereich und Räume */
var RAUM_ART = {
  frei:    {art:"gruen", text:"frei"},
  richten: {art:"grau",  text:"wird hergerichtet"},
  wartet:  {art:"blau",  text:"Patient wartet"},
  arzt:    {art:"gelb",  text:"Behandler im Raum"}
};

ANSICHTEN.raeume = function(){
  var p = praxis();

  if(!p.module.raeume){
    return kopf("Vom Wartebereich ins Zimmer", "In dieser Praxis noch nicht eingeschaltet.") +
      karte(null, null, '<div class="karte-koerper">' + leer("Raumzuteilung ist abgeschaltet",
        "Bei nur einem Behandler und zwei Räumen lohnt sie sich nicht. Einschalten unter „Praxis und Module“.") + '</div>');
  }

  var r = raeume(), w = warteliste();
  var frei = r.filter(function(k){ return k.status === "frei"; }).length;
  var notfaelle = w.filter(function(k){ return k.notfall; }).length;
  var laengste = w.reduce(function(m,k){ return Math.max(m, k.seit); }, 0);

  var tafel = r.map(function(k){
    var s = RAUM_ART[k.status];
    var koerper, aktion = "";

    if(k.status === "frei"){
      var t = naechsteZuteilung(k.beh);
      koerper = '<div class="rleer">Niemand im Raum.</div>';
      aktion = t && (t.raum.id === k.id)
        ? '<button class="knopf klein haupt" data-zuteilen="' + t.patient.nr + '">' +
          sicher(t.patient.name) + ' hereinbitten</button>'
        : '<span class="rleer">Wartet niemand Passendes.</span>';
    } else if(k.status === "richten"){
      koerper = '<div class="rleer">Wird hergerichtet, seit ' + k.seit + ' Min.</div>';
      aktion = '<button class="knopf klein" data-fertigraum="' + k.id + '">Raum ist fertig</button>';
    } else if(k.status === "wartet"){
      koerper = '<div class="rpat">' + sicher(k.pat) + '</div>' +
                '<div class="rzeit">Nr. ' + k.nr + ' · wartet seit ' + k.seit + ' Min.</div>';
      aktion = '<button class="knopf klein" data-betreten="' + k.id + '">Raum betreten</button>';
    } else {
      koerper = '<div class="rpat">' + sicher(k.pat) + '</div>' +
                '<div class="rzeit">Nr. ' + k.nr + ' · im Gespräch seit ' + k.seit + ' Min.</div>';
      aktion = '<button class="knopf klein haupt" data-freigeben="' + k.id + '">Erledigt</button>' +
               '<button class="knopf klein still" data-seite="zimmer">Zimmer öffnen</button>';
    }

    return '<div class="raum ' + k.status + '">' +
      '<div class="rname">' + sicher(k.name) + '</div>' +
      '<div class="rbeh">' + sicher(k.beh) +
        (k.geraet ? '<span class="rgeraet">' + sicher(k.geraet) + '</span>' : '') + '</div>' +
      '<div style="margin-bottom:7px">' + pille(s.art, s.text) + '</div>' +
      '<div class="rkoerper">' + koerper + '</div>' +
      '<div class="rakt">' + aktion + '</div>' +
    '</div>';
  }).join("");

  var warten = w.length ? w.slice().sort(function(x,y){
      if(x.notfall !== y.notfall) return x.notfall ? -1 : 1;
      return y.seit - x.seit;
    }).map(function(k){
    var t = naechsteZuteilung(k.beh);
    var dran = t && t.patient.nr === k.nr;
    return '<tr' + (k.notfall ? ' class="notfall"' : '') + '>' +
      '<td><div class="haupt">' + sicher(k.name) + '</div>' +
          '<div class="neben">Nr. ' + k.nr + ' · ' + sicher(k.beh) + '</div></td>' +
      '<td>' + sicher(k.anlass) +
          (k.braucht ? '<div class="neben">braucht ' + sicher(k.braucht) + '</div>' : '') + '</td>' +
      '<td>' + (k.notfall ? pille("rot","außer der Reihe") : pille("grau", k.seit + " Min.")) + '</td>' +
      '<td class="rechts">' + (dran
          ? '<button class="knopf klein haupt" data-zuteilen="' + k.nr + '">In ' + sicher(t.raum.name) + '</button>'
          : '<span style="color:var(--g400);font-size:12.5px">kein Raum frei</span>') + '</td>' +
    '</tr>';
  }).join("") : '<tr><td colspan="4">' + leer("Niemand wartet") + '</td></tr>';

  return kopf("Vom Wartebereich ins Zimmer",
      "Der Behandler drückt nach dem Patienten auf „Erledigt“ — mehr nicht. Den Rest macht das " +
      "System: Raum freigeben, den nächsten Wartenden hereinbitten, den Stand für alle sichtbar halten.") +
    (zustand.meldung ?
      '<div class="box" style="margin-bottom:16px"><b>Das System hat gerade selbst gehandelt</b>' +
      sicher(zustand.meldung) + '</div>' : '') +
    '<div class="gitter g4" style="margin-bottom:16px">' +
      kennzahl("Räume frei", frei + " von " + r.length, "",
               frei ? "sofort belegbar" : "<b>alles belegt</b>") +
      kennzahl("Im Wartebereich", w.length, "", w.length ? "warten auf einen Raum" : "<b>niemand wartet</b>") +
      kennzahl("Längste Wartezeit", laengste, " Min.", "ab Anmeldung gerechnet") +
      kennzahl("Außer der Reihe", notfaelle, "",
               notfaelle ? "laufen parallel mit" : "derzeit keine") +
    '</div>' +
    karte("Raumtafel", "dieselbe Ansicht an Anmeldung und in jedem Zimmer",
      '<div class="karte-koerper"><div class="raumgitter">' + tafel + '</div></div>',
      "Ein Raum mit Gerät wird nie für jemanden belegt, der das Gerät nicht braucht. " +
      "Der Laserraum bleibt dem Laser vorbehalten, auch wenn er gerade leer steht.") +
    karte("Wer wartet", w.length + " Wartende",
      '<table><thead><tr><th>Patient</th><th>Anlass</th><th>Wartet</th>' +
      '<th class="rechts">Nächster Raum</th></tr></thead><tbody>' + warten + '</tbody></table>') +
    karte("Nach welcher Regel zugeteilt wird", null,
      '<div class="karte-koerper"><ul class="liste-schlicht">' +
      '<li><b>Außer der Reihe geht vor Wartezeit.</b> Wer akut kommt, wird eingeschoben — ' +
      'etwa eine Urtikaria oder ein Neurodermitis-Schub. Etwa jeder fünfte Patient.</li>' +
      '<li><b>Jeder Behandler bekommt nur eigene Patienten.</b> Zwei Räume im Wechsel: ' +
      'während im einen behandelt wird, sitzt im anderen schon der Nächste.</li>' +
      '<li><b>Gerätegebundene Räume sind reserviert.</b> Laser und Eingriffsraum werden nur ' +
      'belegt, wenn das Gerät gebraucht wird.</li>' +
      '<li><b>Das System entscheidet nie, ob etwas ein Notfall ist.</b> Das bleibt beim Team. ' +
      'Es sortiert nur, was ihm gesagt wurde.</li>' +
      '</ul></div>',
      "Die Regeln stehen in den Praxiseinstellungen und lassen sich ändern, ohne dass jemand " +
      "am Programm arbeitet.");
};

/* -------------------------------------------------------- Behandlungszimmer */
ANSICHTEN.zimmer = function(){
  var p = praxis();
  var r = raeume();
  var aktiv = null;
  r.some(function(k){ if(k.status === "arzt"){ aktiv = k; return true; } return false; });

  var ab = zustand.zimmer.abschluss;
  if(ab){
    return kopf("Erledigt",
        "Ein Druck auf einen Knopf — und das hier ist in derselben Sekunde passiert.") +
      karte("Was ausgelöst wurde", sicher(ab.name),
        '<div class="karte-koerper"><ul class="liste-schlicht">' +
        '<li><b>' + sicher(ab.raum) + ' freigegeben</b> und zum Herrichten gemeldet.</li>' +
        '<li><b>' + sicher(ab.naechster) + '</b></li>' +
        '<li><b>Dokumentation unterwegs nach Duria²</b> — als Text über die GDT-Brücke, ' +
        'in die Karteikarte von ' + sicher(ab.name) + '.</li>' +
        '<li><b>' + ab.rezepte + ' Rezept' + (ab.rezepte === 1 ? "" : "e") + ' angestoßen</b>, ' +
        'Ausstellung und Signatur in Duria².</li>' +
        '<li><b>Selbstabschluss vorbereitet:</b> ' + euro(ab.summe) + ' liegen dort bereit, ' +
        'bevor der Patient ankommt.</li>' +
        '</ul></div>',
        "Niemand musste gerufen, geholt, abgehakt oder abends nachgetragen werden.") +
      karte(null, null, '<div class="karte-koerper" style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="knopf haupt" data-seite="raeume">Raumtafel ansehen</button>' +
        '<button class="knopf" data-seite="abschluss">Zum Abschluss und PKV</button>' +
        '<button class="knopf still" data-zuruecksetzen="1">Vorführung zurücksetzen</button>' +
      '</div>');
  }

  if(!aktiv){
    return kopf("Im Behandlungszimmer",
        "Was der Behandler auf dem iPad sieht, während der Patient vor ihm sitzt.") +
      karte(null, null, '<div class="karte-koerper">' +
        leer("Gerade niemand im Gespräch",
             "Unter „Wartebereich und Räume“ einen wartenden Patienten hereinbitten und den Raum betreten.") +
        '<div style="text-align:center"><button class="knopf haupt" data-seite="raeume">Zur Raumtafel</button></div>' +
      '</div>');
  }

  var z = zustand.zimmer;

  var leistungen = ZIMMER_LEISTUNGEN.map(function(l){
    var an = (l.id in z.leistungen) ? z.leistungen[l.id] : l.vor;
    return '<div class="wahl' + (an ? " an" : "") + '" data-leistung="' + l.id + '">' +
      '<div class="kasten">' + (an ? "✓" : "") + '</div>' +
      '<div class="txt">' + sicher(l.text) + (l.unter ? '<span>' + sicher(l.unter) + '</span>' : '') + '</div>' +
      '<div class="betrag">' + (l.betrag ? euro(l.betrag) : "—") + '</div>' +
    '</div>';
  }).join("");

  var summe = ZIMMER_LEISTUNGEN.reduce(function(s,l){
    var an = (l.id in z.leistungen) ? z.leistungen[l.id] : l.vor;
    return s + (an ? l.betrag : 0);

/* ------------------------------------------------- Räume verändern */

function raumHolen(id){
  var k = null;
  raeume().some(function(x){ if(x.id === id){ k = x; return true; } return false; });
  return k;
}
function raumSetzen(id, status){
  var k = raumHolen(id);
  if(k){ k.status = status; k.seit = 0; }
}

/* Sobald ein Raum frei wird, rückt der nächste Wartende nach — das ist der
   Kern: der Behandler kümmert sich nicht darum, dass jemand geholt wird. */
function nachruecken(id){
  var k = raumHolen(id);
  if(!k) return;
  var t = naechsteZuteilung(k.beh);
  if(t && zuteilen(t)){
    zustand.meldung = t.patient.name + " wurde automatisch in " + t.raum.name + " gebeten" +
      (t.patient.notfall ? " — außer der Reihe, weil akut." : ".");
  } else {
    zustand.meldung = k.name + " ist frei. Derzeit wartet niemand Passendes.";
  }
}

/* „Erledigt": Raum räumen, zum Herrichten melden, nächsten Patienten holen. */
function raumFreigeben(id, abschluss){
  var k = raumHolen(id);
  if(!k) return;
  var name = k.pat || "Der Patient";
  k.status = "richten"; k.pat = null; k.nr = null; k.seit = 0;

  var t = naechsteZuteilung(k.beh), satz;
  if(t && zuteilen(t)){
    satz = t.patient.name + " wurde sofort in " + t.raum.name + " gebeten" +
           (t.patient.notfall ? " — außer der Reihe, weil akut." : ".");
  } else {
    satz = "Derzeit wartet niemand Passendes; " + k.name + " bleibt nach dem Herrichten frei.";
  }
  zustand.meldung = name + " ist fertig. " + satz;

  if(abschluss){
    zustand.zimmer = {
      leistungen:{}, rezepte:{}, diktat:false,
      abschluss:{ name:name, raum:k.name, naechster:satz,
                  summe:abschluss.summe, rezepte:abschluss.rezepte }
    };
  }
}

function schubladeSchliessen(){
  document.getElementById("schublade").classList.remove("offen");
  document.getElementById("schleier").classList.remove("offen");
}

/* =================================================================== Aufbau */

function navZeichnen(){
  var p = praxis();
  var erledigt = zustand.erledigt[zustand.mandant] || {};
  var zahlen = {
    heute: p.patienten.filter(function(x){ return x.status !== "fertig"; }).length,
    raeume: p.module.raeume ? warteliste().length : 0,
    telefon: (TELEFON[zustand.mandant] || {}).rueckstand || 0,
    abschluss: p.module.abschluss
      ? p.rechnungen.filter(function(r){ return r.status !== "bezahlt"; }).length : 0,
    wiedervorlage: p.module.wiedervorlage
      ? p.wiedervorlage.filter(function(w){ return !erledigt[w.nr]; }).length : 0,
    bruecke: p.bruecke.wartend + p.bruecke.fehler
  };

  document.getElementById("navigation").innerHTML = SEITEN.map(function(s){
    if(s.gruppe) return '<div class="gruppe">' + s.gruppe + '</div>';
    var z = zahlen[s.id];
    return '<button data-seite="' + s.id + '"' + (zustand.seite === s.id ? ' class="aktiv"' : '') + '>' +
      '<span class="sym">' + s.sym + '</span>' + s.titel +
      (z ? '<span class="zahl">' + z + '</span>' : '') + '</button>';
  }).join("");
}

function kopfZeichnen(){
  var p = praxis();
  document.getElementById("mandantwahl").innerHTML = Object.keys(PRAXEN).map(function(k){
    return '<option value="' + k + '"' + (k === zustand.mandant ? " selected" : "") + '>' +
      sicher(PRAXEN[k].name) + ' — ' + sicher(PRAXEN[k].ort) + '</option>';
  }).join("");

  var d = new Date();
  var tage = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  document.getElementById("datumfeld").textContent =
    tage[d.getDay()] + ", " + d.toLocaleDateString("de-DE",{day:"2-digit",month:"long",year:"numeric"});

  var b = p.bruecke, pil = document.getElementById("bruecke-pille");
  pil.className = "pille " + (b.zustand === "gut" ? "p-gruen" : "p-gelb");
  pil.innerHTML = '<span class="punkt"></span>' +
    (b.zustand === "gut" ? "Duria² verbunden" : "Duria² gestört");
}

function zeichnen(){
  navZeichnen();
  kopfZeichnen();
  var f = ANSICHTEN[zustand.seite] || ANSICHTEN.heute;
  document.getElementById("inhalt").innerHTML = f();
  window.scrollTo(0,0);
}

/* --------------------------------------------------------------- Ereignisse */

document.addEventListener("click", function(e){
  var t = e.target;

  var navKnopf = t.closest ? t.closest("[data-seite]") : null;
  if(navKnopf){
    if(navKnopf.tagName === "A") e.preventDefault();
    zustand.seite = navKnopf.getAttribute("data-seite");
    document.getElementById("seitenleiste").classList.remove("offen");
    adresseSetzen();
    zeichnen(); return;
  }

  var r = t.closest ? t.closest("[data-reiter]") : null;
  if(r){
    zustand.reiter[r.getAttribute("data-reiter")] = r.getAttribute("data-wert");
    zeichnen(); return;
  }

  var m = t.closest ? t.closest("[data-modul]") : null;
  if(m && !m.disabled){
    var schl = m.getAttribute("data-modul");
    praxis().module[schl] = !praxis().module[schl];
    schalterSichern();
    zeichnen(); return;
  }

  var zt = t.closest ? t.closest("[data-zuteilen]") : null;
  if(zt){
    var nr = zt.getAttribute("data-zuteilen");
    var kand = null;
    warteliste().forEach(function(w){ if(w.nr === nr) kand = w; });
    var treffer = kand ? naechsteZuteilung(kand.beh) : null;
    if(treffer && treffer.patient.nr === nr && zuteilen(treffer)){
      zustand.meldung = treffer.patient.name + " wartet jetzt in " + treffer.raum.name + ".";
    }
    zeichnen(); return;
  }

  var fr = t.closest ? t.closest("[data-fertigraum]") : null;
  if(fr){
    raumSetzen(fr.getAttribute("data-fertigraum"), "frei");
    nachruecken(fr.getAttribute("data-fertigraum"));
    zeichnen(); return;
  }

  var bt = t.closest ? t.closest("[data-betreten]") : null;
  if(bt){
    raumSetzen(bt.getAttribute("data-betreten"), "arzt");
    zustand.zimmer = { leistungen:{}, rezepte:{}, diktat:false, abschluss:null };
    zustand.meldung = null;
    zustand.seite = "zimmer"; adresseSetzen();
    zeichnen(); return;
  }

  var fg = t.closest ? t.closest("[data-freigeben]") : null;
  if(fg){ raumFreigeben(fg.getAttribute("data-freigeben"), null); zeichnen(); return; }

  var fe = t.closest ? t.closest("[data-erledigt]") : null;
  if(fe){
    var z = zustand.zimmer;
    var s = ZIMMER_LEISTUNGEN.reduce(function(a,l){
      var an = (l.id in z.leistungen) ? z.leistungen[l.id] : l.vor;
      return a + (an ? l.betrag : 0);
    }, 0);
    var anz = Object.keys(z.rezepte).filter(function(k){ return z.rezepte[k]; }).length;
    raumFreigeben(fe.getAttribute("data-erledigt"), {summe:s, rezepte:anz});
    zeichnen(); return;
  }

  var ls = t.closest ? t.closest("[data-leistung]") : null;
  if(ls){
    var li = ls.getAttribute("data-leistung"), vor = false;
    ZIMMER_LEISTUNGEN.forEach(function(l){ if(l.id === li) vor = l.vor; });
    var jetzt = (li in zustand.zimmer.leistungen) ? zustand.zimmer.leistungen[li] : vor;
    zustand.zimmer.leistungen[li] = !jetzt;
    zeichnen(); return;
  }

  var rz = t.closest ? t.closest("[data-rezept]") : null;
  if(rz){
    var ri = rz.getAttribute("data-rezept");
    zustand.zimmer.rezepte[ri] = !zustand.zimmer.rezepte[ri];
    zeichnen(); return;
  }

  var dk = t.closest ? t.closest("[data-diktat]") : null;
  if(dk){ zustand.zimmer.diktat = true; zeichnen(); return; }

  var zr = t.closest ? t.closest("[data-zuruecksetzen]") : null;
  if(zr){
    delete zustand.raumStand[zustand.mandant];
    delete zustand.warteStand[zustand.mandant];
    zustand.zimmer = { leistungen:{}, rezepte:{}, diktat:false, abschluss:null };
    zustand.meldung = null;
    zeichnen(); return;
  }

  var erl = t.closest ? t.closest("[data-erledigt-wv]") : null;
  if(erl){
    var nr = erl.getAttribute("data-erledigt-wv");
    if(!zustand.erledigt[zustand.mandant]) zustand.erledigt[zustand.mandant] = {};
    zustand.erledigt[zustand.mandant][nr] = true;
    zeichnen(); return;
  }

  var ern = t.closest ? t.closest("[data-erinnern]") : null;
  if(ern){
    ern.textContent = "Vorgemerkt";
    ern.disabled = true;
    return;
  }

  var zeile = t.closest ? t.closest("[data-patient]") : null;
  if(zeile){ schubladeOeffnen(zeile.getAttribute("data-patient")); return; }

  if(t.id === "schubladeZu" || t.id === "schleier"){ schubladeSchliessen(); return; }

  if(t.id === "menuknopf"){
    document.getElementById("seitenleiste").classList.toggle("offen");
    return;
  }
});

document.getElementById("mandantwahl").addEventListener("change", function(e){
  zustand.mandant = e.target.value;
  zustand.reiter = {};
  schubladeSchliessen();
  adresseSetzen();
  zeichnen();
});

/* Ansicht und Praxis stehen in der Adresse — so lässt sich eine Ansicht verlinken. */
function adresseSetzen(){
  try{
    var neu = "#" + zustand.mandant + "/" + zustand.seite;
    if(window.location.hash !== neu) window.history.replaceState(null, "", neu);
  }catch(e){ /* egal */ }
}
function adresseLesen(){
  var roh = (window.location.hash || "").replace(/^#/, "");
  if(!roh) return;
  var teile = roh.split("/");
  if(teile[0] && PRAXEN[teile[0]]) zustand.mandant = teile[0];
  if(teile[1] && ANSICHTEN[teile[1]]) zustand.seite = teile[1];
}

document.addEventListener("keydown", function(e){
  if(e.key === "Escape") schubladeSchliessen();
});

/* ------------------------------------------------------------------ Start */
schalterLaden();
adresseLesen();
adresseSetzen();
zeichnen();

})();
</script>

</html>
